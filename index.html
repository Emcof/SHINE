    body {

      margin: 0;
      background-color: #f5f5f5;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: flex-start; /* 왼쪽에 콘텐츠 정렬 */
      align-items: flex-start; /* 상단에 정렬 */
      position: relative;
      overflow: hidden;
    }

    /* 오른쪽 섹션 배치 */
    .right-section {
      display: flex;
      flex-direction: column; /* 세로로 정렬 */
      padding: 20px;
      margin-left: 50px; /* 왼쪽에 여백 추가 */
    }

    /* 배경 이미지 설정 */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('https://emcof.github.io/SHINE/image.jpg'); /* 이미지 경로 */
      background-size: cover;
      background-position: center;
      opacity: 1; /* 배경의 투명도 조절 */
      z-index: -1; /* 배경이 뒤로 가도록 설정 */
    }

    header {
      margin-bottom: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.7); /* 반투명 배경을 추가해 텍스트 가독성 증가 */
      border-radius: 10px;
      z-index: 1;
    }

    h1 {
      font-size: 2.5em;
      color: #333;
    }

    section {
      margin-bottom: 30px;
    }

    .project {
      margin-bottom: 10px;
    }

    .project-title {
      font-weight: bold;
    }

    /* 기타 스타일 */
    .project p {
      font-size: 1.1em;
    }
  </style>
</head>
