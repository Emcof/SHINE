    /* 배경 이미지 설정 */
    body::before {

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('https://emcof.github.io/SHINE/image.jpg');
      background-size: cover;
      background-position: center;
      opacity: 1;
      z-index: -1;
    }

    header {

      background: rgba(255, 255, 255, 0.7);

      z-index: 1;

    a {
      color: yellow; /* 노란색 */
      text-decoration: none; /* 밑줄 제거 */
    }

    a:hover {
      text-decoration: underline; /* 호버 시 밑줄 표시 */
    }

    h2, p, .project-title {
      color: white;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
    }

    section {
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.4);
      padding: 20px;
      border-radius: 10px;
      z-index: 1;
    }

    .project {
      margin-bottom: 10px;
    }

    .project-title {
      font-weight: bold;
    }

    .project p {
      font-size: 1.1em;
    }
  </style>
</head>
